apiVersion: 1

datasources:
  - name: 'Litmus Edge'
    type: 'litmus-edge-datasource'
    access: proxy
    isDefault: true
    orgId: 1
    version: 1
    editable: true
    jsonData:
      externalEdge: ${EDGE_EXTERNAL}
      gatewayIp: ${EDGE_DOCKER_GATEWAY_IP}
      edgeUrl: $EDGE_URL
      hostname: $EDGE_HOSTNAME
      natsProxyPort: $EDGE_NATS_PROXY_PORT
    secureJsonData:
      token: $EDGE_ACCESS_ACCOUNT_API_KEY
      accessAccountApiToken: $EDGE_API_TOKEN
      brokerToken: $EDGE_ACCESS_ACCOUNT_TOKEN
      legacyBrokerToken: $EDGE_NATS_TOKEN
      legacyNatsToken: $NATS_TOKEN
      apiToken: $EDGE_DEVICEHUB_API_TOKEN
